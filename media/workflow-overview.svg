<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="820" viewBox="0 0 1920 820" role="img" aria-labelledby="title desc">
  <title id="title">智选 Agent Coze MVP 工作流总览</title>
  <desc id="desc">展示用户输入、参数提取、缺失信息追问、商品检索、规则排序、推荐理由生成和无结果兜底的完整分支。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F9FC"/>
      <stop offset="1" stop-color="#EEF2F8"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A45"/>
      <stop offset="1" stop-color="#FF9A62"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1C2A42" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#75839B"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F27A48"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7B6CE8"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DE6B68"/>
    </marker>
    <style>
      text { font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
      .eyebrow { font-size: 18px; font-weight: 700; letter-spacing: 3px; fill: #F06D3B; }
      .title { font-size: 42px; font-weight: 750; fill: #17233A; }
      .subtitle { font-size: 20px; fill: #65738B; }
      .node-title { font-size: 21px; font-weight: 700; fill: #17233A; }
      .node-copy { font-size: 16px; fill: #68758C; }
      .step { font-size: 14px; font-weight: 700; fill: #FFFFFF; }
      .branch { font-size: 15px; font-weight: 650; }
      .small { font-size: 14px; fill: #708097; }
      .footer-head { font-size: 16px; font-weight: 700; fill: #2B3B55; }
      .footer-copy { font-size: 15px; fill: #65738B; }
    </style>
  </defs>

  <rect width="1920" height="820" fill="url(#bg)"/>
  <circle cx="1730" cy="50" r="210" fill="#FF8A55" opacity="0.06"/>
  <circle cx="80" cy="760" r="220" fill="#7468E8" opacity="0.05"/>

  <text class="eyebrow" x="72" y="70">COZE MVP · RULE_V1</text>
  <text class="title" x="72" y="122">从模糊需求到可解释推荐的核心闭环</text>
  <text class="subtitle" x="72" y="158">3C / 数码智能导购 · 15 条完全合成商品数据 · 三种互斥输出状态</text>

  <!-- main flow -->
  <g filter="url(#shadow)">
    <rect x="64" y="230" width="200" height="118" rx="22" fill="#FFFFFF" stroke="#DDE3EC"/>
    <circle cx="95" cy="259" r="16" fill="url(#brand)"/>
    <text class="step" x="95" y="264" text-anchor="middle">01</text>
    <text class="node-title" x="88" y="300">用户输入</text>
    <text class="node-copy" x="88" y="328">自然语言购买需求</text>

    <rect x="306" y="230" width="220" height="118" rx="22" fill="#FFFFFF" stroke="#DDE3EC"/>
    <circle cx="337" cy="259" r="16" fill="url(#brand)"/>
    <text class="step" x="337" y="264" text-anchor="middle">02</text>
    <text class="node-title" x="330" y="300">参数提取</text>
    <text class="node-copy" x="330" y="328">品类 · 预算 · 场景 · 优先项</text>

    <path d="M 642 222 L 724 289 L 642 356 L 560 289 Z" fill="#FFF8F2" stroke="#F3A070" stroke-width="2"/>
    <text class="node-title" x="642" y="282" text-anchor="middle">信息</text>
    <text class="node-title" x="642" y="309" text-anchor="middle">完整？</text>

    <rect x="766" y="230" width="214" height="118" rx="22" fill="#FFFFFF" stroke="#DDE3EC"/>
    <circle cx="797" cy="259" r="16" fill="url(#brand)"/>
    <text class="step" x="797" y="264" text-anchor="middle">03</text>
    <text class="node-title" x="790" y="300">商品检索</text>
    <text class="node-copy" x="790" y="328">品类 · 预算 · 库存硬过滤</text>

    <path d="M 1092 222 L 1174 289 L 1092 356 L 1010 289 Z" fill="#F7F9FF" stroke="#8B8EEB" stroke-width="2"/>
    <text class="node-title" x="1092" y="282" text-anchor="middle">存在</text>
    <text class="node-title" x="1092" y="309" text-anchor="middle">候选？</text>

    <rect x="1216" y="230" width="218" height="118" rx="22" fill="#FFFFFF" stroke="#DDE3EC"/>
    <circle cx="1247" cy="259" r="16" fill="url(#brand)"/>
    <text class="step" x="1247" y="264" text-anchor="middle">04</text>
    <text class="node-title" x="1240" y="300">规则排序</text>
    <text class="node-copy" x="1240" y="328">rule_v1 · 稳定 Top 3</text>

    <rect x="1476" y="230" width="236" height="118" rx="22" fill="#FFFFFF" stroke="#DDE3EC"/>
    <circle cx="1507" cy="259" r="16" fill="url(#brand)"/>
    <text class="step" x="1507" y="264" text-anchor="middle">05</text>
    <text class="node-title" x="1500" y="300">理由生成</text>
    <text class="node-copy" x="1500" y="328">事实守卫 · 预算 · 取舍</text>

    <rect x="1760" y="216" width="110" height="146" rx="26" fill="#17233A"/>
    <text x="1815" y="252" text-anchor="middle" font-size="14" font-weight="700" fill="#FF9A62">END</text>
    <text x="1815" y="287" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">统一</text>
    <text x="1815" y="315" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">响应</text>
    <text x="1815" y="342" text-anchor="middle" font-size="13" fill="#B8C2D4">3 种状态</text>
  </g>

  <!-- main arrows -->
  <g fill="none" stroke="#75839B" stroke-width="3" marker-end="url(#arrow)">
    <path d="M 264 289 H 296"/>
    <path d="M 526 289 H 550"/>
    <path d="M 724 289 H 756"/>
    <path d="M 980 289 H 1000"/>
    <path d="M 1174 289 H 1206"/>
    <path d="M 1434 289 H 1466"/>
  </g>
  <path d="M 1712 289 H 1750" fill="none" stroke="#F27A48" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <text class="branch" x="738" y="270" fill="#2F7D63">完整</text>
  <text class="branch" x="1183" y="270" fill="#2F7D63">有候选</text>

  <!-- clarification branch -->
  <path d="M 642 356 V 424" fill="none" stroke="#7B6CE8" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <text class="branch" x="658" y="395" fill="#6B5DD7">缺信息</text>
  <g filter="url(#shadow)">
    <rect x="470" y="438" width="344" height="126" rx="22" fill="#F5F2FF" stroke="#9C90EB"/>
    <rect x="490" y="461" width="72" height="26" rx="13" fill="#7B6CE8"/>
    <text x="526" y="480" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">追问分支</text>
    <text class="node-title" x="490" y="520">只追问一个关键问题</text>
    <text class="node-copy" x="490" y="547">品类 → 预算 → 使用场景</text>
  </g>

  <!-- no-result branch -->
  <path d="M 1092 356 V 424" fill="none" stroke="#DE6B68" stroke-width="3" marker-end="url(#arrow-red)"/>
  <text class="branch" x="1108" y="395" fill="#C75A58">无候选</text>
  <g filter="url(#shadow)">
    <rect x="920" y="438" width="344" height="126" rx="22" fill="#FFF3F1" stroke="#E18783"/>
    <rect x="940" y="461" width="86" height="26" rx="13" fill="#DE6B68"/>
    <text x="983" y="480" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">兜底分支</text>
    <text class="node-title" x="940" y="520">不虚构商品，给可执行建议</text>
    <text class="node-copy" x="940" y="547">最低可用价 · 预算差额 · 放宽方向</text>
  </g>

  <!-- branch routes to unified response -->
  <path d="M 814 501 H 851 V 606 H 1815 V 372" fill="none" stroke="#7B6CE8" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow-purple)"/>
  <path d="M 1264 501 H 1301 V 634 H 1845 V 372" fill="none" stroke="#DE6B68" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow-red)"/>

  <!-- metric strip -->
  <g>
    <rect x="64" y="680" width="1806" height="92" rx="22" fill="#FFFFFF" stroke="#DDE3EC"/>
    <rect x="64" y="680" width="8" height="92" rx="4" fill="url(#brand)"/>
    <text class="footer-head" x="96" y="717">透明排序权重</text>
    <text class="footer-copy" x="96" y="744">需求匹配 35%</text>
    <circle cx="254" cy="737" r="3" fill="#C0C8D5"/>
    <text class="footer-copy" x="270" y="744">预算匹配 25%</text>
    <circle cx="429" cy="737" r="3" fill="#C0C8D5"/>
    <text class="footer-copy" x="445" y="744">评分 20%</text>
    <circle cx="555" cy="737" r="3" fill="#C0C8D5"/>
    <text class="footer-copy" x="571" y="744">销量 10%</text>
    <circle cx="681" cy="737" r="3" fill="#C0C8D5"/>
    <text class="footer-copy" x="697" y="744">库存 10%</text>
    <line x1="840" y1="700" x2="840" y2="752" stroke="#E0E5ED"/>
    <text class="footer-head" x="874" y="717">展示边界</text>
    <text class="footer-copy" x="874" y="744">合成商品与离线等价规则 · 非 Coze 平台截图 · 不包含真实用户或商家数据</text>
  </g>
</svg>
