    <rect x="16" y="30" width="320" height="270" rx="26" fill="#FFFFFF" opacity="0.96" transform="rotate(2 176 165)"/>
    <rect width="332" height="286" rx="28" fill="#FFFFFF"/>
    <rect x="24" y="22" width="76" height="28" rx="14" fill="#FFF0E9"/>
    <text x="62" y="41" text-anchor="middle" font-size="13" font-weight="700" fill="#F06D3B">TOP 1</text>
    <text x="24" y="91" font-size="24" font-weight="750" fill="#17233A">星澜 Air 14</text>
    <text x="24" y="122" font-size="16" fill="#6C788C">轻薄 · 编程 · 出差 · 续航</text>
