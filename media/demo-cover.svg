    <line x1="24" y1="232" x2="308" y2="232" stroke="#E4E8EF"/>
    <text x="24" y="264" font-size="15" fill="#55637A">¥6,999</text>
    <text x="308" y="264" text-anchor="end" font-size="15" font-weight="700" fill="#2D8A67">预算余量 ¥1,001</text>
